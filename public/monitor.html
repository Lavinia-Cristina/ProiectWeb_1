<!DOCTYPE html>
<html lang="ro" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor Central Restaurant · Restaurant Kon Tiki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
  <style>
    body {
      padding: var(--space-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .monitor-viewport {
      width: 100%;
      max-width: 1300px;
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }
    /* Ticker Comenzi Gata */
    .ready-ticker-bar {
      background: var(--color-surface);
      border: 2px solid var(--color-success);
      border-radius: var(--radius-md);
      padding: var(--space-md) var(--space-lg);
      box-shadow: 0 0 15px rgba(45, 106, 79, 0.25);
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }
    .ready-ticker-icon {
      font-size: 24px;
      animation: bellShake 1.5s infinite;
    }
    @keyframes bellShake {
      0%, 100% { transform: rotate(0); }
      20%, 60% { transform: rotate(-12deg); }
      40%, 80% { transform: rotate(12deg); }
    }
    .ready-ticker-content {
      display: flex;
      gap: var(--space-md);
      flex-wrap: wrap;
      flex-grow: 1;
      align-items: center;
    }
    .ready-chip {
      background: rgba(45, 106, 79, 0.2);
      border: 1px solid var(--color-success);
      color: var(--color-success);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    /* Grid Mese Sală */
    .tables-matrix {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-md);
    }
    @media (max-width: 1000px) {
      .tables-matrix { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 700px) {
      .tables-matrix { grid-template-columns: repeat(2, 1fr); }
    }
    .table-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 150px;
      transition: all var(--transition-fast);
    }
    .table-card.st-ocupata {
      border-top: 5px solid var(--color-warning);
    }
    .table-card.st-libera {
      border-top: 5px solid var(--color-success);
      opacity: 0.8;
    }
    .table-card.st-rezervata {
      border-top: 5px solid #0284c7;
    }
    .table-card.has-ready-food {
      border: 2px solid var(--color-success);
      box-shadow: 0 0 16px rgba(45, 106, 79, 0.4);
    }
    .table-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-xs);
    }
    .table-card-num {
      font-family: var(--font-heading);
      font-size: 20px;
      font-weight: 700;
    }
    .orders-mini-list {
      font-size: 12px;
      color: var(--color-text-muted);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <nav class="top-navbar" style="max-width: 1300px; border-radius: var(--radius-md); margin-bottom: 12px;">
    <div style="display:flex; align-items:center; gap:var(--space-md);">
      <a href="/" class="brand-title">🍲 Restaurant Kon Tiki</a>
      <span class="badge badge-info">Monitor Central Sală</span>
    </div>
    <div class="nav-links">
      <span id="sse-status-badge" class="badge badge-success">● Live</span>
      <a href="/kds.html" class="nav-link">Bucătărie</a>
      <a href="/waiter.html" class="nav-link">Ospătar</a>
      <a href="/cashier.html" class="nav-link">Casă</a>
      <button class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Comută tema">
        <span id="theme-toggle-label">☀️ Temă</span>
      </button>
    </div>
  </nav>

  <div class="monitor-viewport">

    <!-- Ticker Comenzi Gata de Preluare -->
    <div class="ready-ticker-bar" id="ready-ticker">
      <div class="ready-ticker-icon">🔔</div>
      <div style="font-weight:700; font-size:14px; color:var(--color-success);">GATA DE PRELUARE OSPĂTARI:</div>
      <div class="ready-ticker-content" id="ready-chips-container">
        <span style="font-size:13px; color:var(--color-text-muted);">Nicio comandă în așteptare de preluare. Bucătăria lucrează la comenzi.</span>
      </div>
    </div>

    <!-- Matrice Mese 1-12 -->
    <div class="tables-matrix" id="tables-matrix-container">
      <!-- Generat dinamic -->
    </div>

  </div>

  <script src="/js/app.js"></script>
  <script>
    async function loadMonitorData() {
      try {
        const [resTables, resOrders] = await Promise.all([
          fetch('/api/tables'),
          fetch('/api/orders?activeOnly=true')
        ]);
        const dataTables = await resTables.json();
        const dataOrders = await resOrders.json();

        if (dataTables.success && dataOrders.success) {
          renderMonitor(dataTables.tables, dataOrders.orders);
        }
      } catch (err) {
        console.error('Eroare monitor:', err);
      }
    }

    function renderMonitor(tables, orders) {
      // 1. Ticker comenzi gata
      const readyOrders = orders.filter(o => o.status === 'gata');
      const tickerContainer = document.getElementById('ready-chips-container');
      tickerContainer.innerHTML = '';

      if (readyOrders.length === 0) {
        tickerContainer.innerHTML = '<span style="font-size:13px; color:var(--color-text-muted);">Toate preparatele finalizate au fost preluate de ospătari.</span>';
      } else {
        for (const ord of readyOrders) {
          const chip = document.createElement('div');
          chip.className = 'ready-chip';
          chip.innerHTML = `
            <span>🍽️ <strong>Masa ${ord.table_number}</strong> (#${ord.id.slice(-4)})</span>
          `;
          tickerContainer.appendChild(chip);
        }
      }

      // 2. Matrice 12 Mese
      const matrix = document.getElementById('tables-matrix-container');
      matrix.innerHTML = '';

      const ordersByTable = {};
      for (const ord of orders) {
        if (!ordersByTable[ord.table_number]) ordersByTable[ord.table_number] = [];
        ordersByTable[ord.table_number].push(ord);
      }

      for (const t of tables) {
        const tableOrders = ordersByTable[t.table_number] || [];
        const hasReadyFood = tableOrders.some(o => o.status === 'gata');

        let statusClass = 'st-libera';
        if (t.status === 'ocupată') statusClass = 'st-ocupata';
        if (t.status === 'rezervată') statusClass = 'st-rezervata';

        const card = document.createElement('div');
        card.className = `table-card ${statusClass} ${hasReadyFood ? 'has-ready-food' : ''}`;

        let statusBadge = `<span class="badge badge-success">Liberă</span>`;
        if (t.status === 'ocupată') statusBadge = `<span class="badge badge-warning">Ocupată</span>`;
        if (t.status === 'rezervată') statusBadge = `<span class="badge badge-info">Rezervată</span>`;

        let ordersContent = '';
        if (tableOrders.length === 0) {
          ordersContent = '<div style="font-size:12px; color:var(--color-text-muted);">Fără consumație activă</div>';
        } else {
          ordersContent = tableOrders.map(o => `
            <div>• #${o.id.slice(-4)}: <strong style="color:${o.status === 'gata' ? 'var(--color-success)' : 'var(--color-text)'}">${o.status}</strong> (${Number(o.total_price).toFixed(2)} lei)</div>
          `).join('');
        }

        card.innerHTML = `
          <div>
            <div class="table-card-top">
              <div class="table-card-num">Masa ${t.table_number}</div>
              <div>${statusBadge}</div>
            </div>
            <div class="orders-mini-list">
              ${ordersContent}
            </div>
          </div>
          <div style="font-size:11px; color:var(--color-text-muted); margin-top:8px; border-top:1px solid var(--color-border); padding-top:4px; display:flex; justify-content:space-between;">
            <span>${tableOrders.length} comenzi active</span>
            <a href="/client-menu.html?masa=${t.table_number}" style="color:var(--color-primary); text-decoration:none;">QR Meniu →</a>
          </div>
        `;
        matrix.appendChild(card);
      }
    }

    loadMonitorData();

    // Actualizări instant via SSE (D-002)
    sseClient.on('order:new', () => loadMonitorData());
    sseClient.on('order:status', () => loadMonitorData());
    sseClient.on('table:status', () => loadMonitorData());
    sseClient.on('payment:done', () => loadMonitorData());
  </script>
</body>
</html>
